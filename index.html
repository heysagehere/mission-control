<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mission Control</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=DM+Serif+Display&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #FDF8F3;
      --card-bg: #FFFFFF;
      --text: #2D2A26;
      --text-muted: #6B6560;
      --accent: #E07A3D;
      --accent-light: #FFF0E8;
      --border: #E8E2DC;
      --column-bg: rgba(255, 255, 255, 0.6);
      --high: #E07A3D;
      --medium: #7B9E6B;
      --low: #8B9DC3;
      --shadow: 0 2px 8px rgba(45, 42, 38, 0.08);
      --shadow-hover: 0 4px 16px rgba(45, 42, 38, 0.12);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      line-height: 1.5;
    }

    header {
      padding: 1.5rem 1rem;
      text-align: center;
      border-bottom: 1px solid var(--border);
      background: var(--card-bg);
    }

    h1 {
      font-family: 'DM Serif Display', serif;
      font-size: 1.75rem;
      font-weight: 400;
      color: var(--text);
      margin-bottom: 0.25rem;
    }

    .last-updated {
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    .board {
      display: flex;
      gap: 1rem;
      padding: 1rem;
      overflow-x: auto;
      min-height: calc(100vh - 100px);
      align-items: flex-start;
    }

    @media (max-width: 768px) {
      .board {
        flex-direction: column;
        overflow-x: visible;
      }
    }

    .column {
      flex: 1;
      min-width: 280px;
      max-width: 350px;
      background: var(--column-bg);
      border-radius: 16px;
      padding: 1rem;
      backdrop-filter: blur(10px);
    }

    @media (max-width: 768px) {
      .column {
        max-width: 100%;
        min-width: 100%;
      }
    }

    .column-header {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      margin-bottom: 1rem;
      padding-bottom: 0.75rem;
      border-bottom: 2px solid var(--border);
    }

    .column-emoji {
      font-size: 1.25rem;
    }

    .column-title {
      font-weight: 600;
      font-size: 1rem;
      color: var(--text);
    }

    .column-count {
      margin-left: auto;
      background: var(--accent-light);
      color: var(--accent);
      font-size: 0.75rem;
      font-weight: 600;
      padding: 0.2rem 0.5rem;
      border-radius: 20px;
    }

    .cards {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    .card {
      background: var(--card-bg);
      border-radius: 12px;
      padding: 1rem;
      box-shadow: var(--shadow);
      transition: all 0.2s ease;
      border: 1px solid var(--border);
    }

    .card:hover {
      box-shadow: var(--shadow-hover);
      transform: translateY(-2px);
    }

    .card-title {
      font-weight: 600;
      font-size: 0.95rem;
      margin-bottom: 0.5rem;
      color: var(--text);
    }

    .card-meta {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      flex-wrap: wrap;
    }

    .owner {
      font-size: 0.75rem;
      color: var(--text-muted);
      background: var(--bg);
      padding: 0.2rem 0.5rem;
      border-radius: 4px;
    }

    .owner.alex {
      background: #E8F4EA;
      color: #4A7C59;
    }

    .owner.iso {
      background: #E8EDF4;
      color: #4A5C7C;
    }

    .owner.both {
      background: #F4E8F0;
      color: #7C4A6A;
    }

    .priority {
      font-size: 0.7rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      padding: 0.15rem 0.4rem;
      border-radius: 4px;
    }

    .priority.high {
      background: #FDEAE4;
      color: var(--high);
    }

    .priority.medium {
      background: #EAF2E7;
      color: var(--medium);
    }

    .priority.low {
      background: #E8ECF4;
      color: var(--low);
    }

    .card-notes {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-top: 0.5rem;
      line-height: 1.4;
    }

    .empty-state {
      text-align: center;
      padding: 2rem 1rem;
      color: var(--text-muted);
      font-size: 0.9rem;
    }

    .refresh-indicator {
      position: fixed;
      bottom: 1rem;
      right: 1rem;
      background: var(--card-bg);
      padding: 0.5rem 1rem;
      border-radius: 20px;
      font-size: 0.75rem;
      color: var(--text-muted);
      box-shadow: var(--shadow);
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    .refresh-indicator.visible {
      opacity: 1;
    }

    .loading {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      font-size: 1.2rem;
      color: var(--text-muted);
    }
  </style>
</head>
<body>
  <div id="app" class="loading">Loading...</div>
  <div id="refresh" class="refresh-indicator">Updated just now</div>

  <script>
    const DATA_URL = 'data.json';
    const REFRESH_INTERVAL = 30000; // 30 seconds

    let lastData = null;

    async function fetchData() {
      try {
        const res = await fetch(DATA_URL + '?t=' + Date.now());
        return await res.json();
      } catch (e) {
        console.error('Failed to fetch data:', e);
        return null;
      }
    }

    function formatTime(iso) {
      const date = new Date(iso);
      const now = new Date();
      const diff = now - date;
      
      if (diff < 60000) return 'just now';
      if (diff < 3600000) return Math.floor(diff / 60000) + 'm ago';
      if (diff < 86400000) return Math.floor(diff / 3600000) + 'h ago';
      return date.toLocaleDateString();
    }

    function render(data) {
      const app = document.getElementById('app');
      
      const columnsHtml = data.columns.map(col => {
        const cards = data.cards.filter(c => c.column === col.id);
        
        const cardsHtml = cards.length ? cards.map(card => `
          <div class="card">
            <div class="card-title">${card.title}</div>
            <div class="card-meta">
              <span class="owner ${card.owner.toLowerCase()}">${card.owner}</span>
              ${card.priority ? `<span class="priority ${card.priority}">${card.priority}</span>` : ''}
            </div>
            ${card.notes ? `<div class="card-notes">${card.notes}</div>` : ''}
          </div>
        `).join('') : '<div class="empty-state">Nothing here yet</div>';

        return `
          <div class="column">
            <div class="column-header">
              <span class="column-emoji">${col.emoji}</span>
              <span class="column-title">${col.title}</span>
              <span class="column-count">${cards.length}</span>
            </div>
            <div class="cards">${cardsHtml}</div>
          </div>
        `;
      }).join('');

      app.innerHTML = `
        <header>
          <h1>Mission Control</h1>
          <div class="last-updated">Updated ${formatTime(data.lastUpdated)}</div>
        </header>
        <div class="board">${columnsHtml}</div>
      `;
      app.classList.remove('loading');
    }

    function showRefreshIndicator() {
      const el = document.getElementById('refresh');
      el.classList.add('visible');
      setTimeout(() => el.classList.remove('visible'), 2000);
    }

    async function checkForUpdates() {
      const data = await fetchData();
      if (!data) return;
      
      if (lastData && JSON.stringify(data) !== JSON.stringify(lastData)) {
        render(data);
        showRefreshIndicator();
      }
      lastData = data;
    }

    async function init() {
      const data = await fetchData();
      if (data) {
        lastData = data;
        render(data);
        setInterval(checkForUpdates, REFRESH_INTERVAL);
      } else {
        document.getElementById('app').innerHTML = '<div class="loading">Failed to load data</div>';
      }
    }

    init();
  </script>
</body>
</html>
