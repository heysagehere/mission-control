<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Mission Control</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎯</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=DM+Serif+Display&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #FDF8F3;
      --card-bg: #FFFFFF;
      --text: #2D2A26;
      --text-muted: #6B6560;
      --text-light: #9B9590;
      --accent: #E07A3D;
      --accent-light: #FFF0E8;
      --border: #E8E2DC;
      --column-bg: rgba(255, 255, 255, 0.6);
      --blocked-bg: rgba(255, 240, 230, 0.6);
      --done-bg: rgba(240, 248, 240, 0.6);
      --high: #D64545;
      --medium: #E07A3D;
      --low: #7B9E6B;
      --shadow: 0 2px 8px rgba(45, 42, 38, 0.08);
      --shadow-hover: 0 4px 16px rgba(45, 42, 38, 0.12);
      --radius: 12px;
    }

    [data-theme="dark"] {
      --bg: #1A1918;
      --card-bg: #2A2826;
      --text: #F0EDE8;
      --text-muted: #9B9590;
      --text-light: #6B6560;
      --border: #3A3836;
      --column-bg: rgba(42, 40, 38, 0.8);
      --blocked-bg: rgba(60, 45, 35, 0.8);
      --done-bg: rgba(35, 50, 40, 0.8);
      --shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
      --shadow-hover: 0 4px 16px rgba(0, 0, 0, 0.4);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      min-height: 100dvh;
      line-height: 1.5;
      overflow-x: hidden;
    }

    header {
      padding: 1rem;
      background: var(--card-bg);
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .header-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 0.75rem;
    }

    h1 {
      font-family: 'DM Serif Display', serif;
      font-size: 1.5rem;
      font-weight: 400;
    }

    .last-updated {
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    .theme-toggle {
      background: var(--bg);
      border: 1px solid var(--border);
      width: 32px;
      height: 32px;
      border-radius: 50%;
      cursor: pointer;
      font-size: 1rem;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
    }

    .theme-toggle:hover {
      border-color: var(--accent);
    }

    .filters {
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
    }

    .filter-btn {
      background: var(--bg);
      border: 1px solid var(--border);
      padding: 0.35rem 0.75rem;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
      font-family: inherit;
      color: var(--text-muted);
    }

    .filter-btn:hover { border-color: var(--accent); }
    .filter-btn.active {
      background: var(--accent);
      color: white;
      border-color: var(--accent);
    }

    .filter-btn .count {
      background: rgba(255,255,255,0.3);
      padding: 0.1rem 0.4rem;
      border-radius: 10px;
      margin-left: 0.3rem;
      font-size: 0.65rem;
    }

    .filter-btn.active .count {
      background: rgba(255,255,255,0.25);
    }

    .board {
      display: flex;
      gap: 1rem;
      padding: 1rem;
      overflow-x: auto;
      min-height: calc(100vh - 120px);
      min-height: calc(100dvh - 120px);
      align-items: flex-start;
      scroll-snap-type: x mandatory;
      -webkit-overflow-scrolling: touch;
    }

    @media (max-width: 768px) {
      .board { padding: 0.75rem; gap: 0.75rem; }
    }

    .column {
      flex: 0 0 300px;
      min-width: 280px;
      max-width: 320px;
      background: var(--column-bg);
      border-radius: var(--radius);
      padding: 0.75rem;
      backdrop-filter: blur(10px);
      scroll-snap-align: start;
    }

    .column.blocked { background: var(--blocked-bg); }
    .column.done { background: var(--done-bg); }

    @media (max-width: 768px) {
      .column {
        flex: 0 0 85vw;
        min-width: 85vw;
        max-width: 85vw;
      }
    }

    .column-header {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      margin-bottom: 0.75rem;
      padding-bottom: 0.5rem;
      border-bottom: 2px solid var(--border);
    }

    .column-emoji { font-size: 1.1rem; }
    .column-title { font-weight: 600; font-size: 0.9rem; }
    .column-count {
      margin-left: auto;
      background: var(--accent-light);
      color: var(--accent);
      font-size: 0.7rem;
      font-weight: 600;
      padding: 0.15rem 0.4rem;
      border-radius: 20px;
    }

    .cards { display: flex; flex-direction: column; gap: 0.6rem; }

    .card {
      background: var(--card-bg);
      border-radius: var(--radius);
      padding: 0.85rem;
      box-shadow: var(--shadow);
      transition: all 0.2s ease;
      border-left: 3px solid var(--border);
      cursor: pointer;
    }

    .card:hover {
      box-shadow: var(--shadow-hover);
      transform: translateY(-1px);
    }

    .card.done-card {
      opacity: 0.7;
      border-left-color: var(--low);
    }

    .card-project {
      font-size: 0.65rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 0.4rem;
      display: inline-block;
      padding: 0.1rem 0.4rem;
      border-radius: 4px;
    }

    .card-title {
      font-weight: 600;
      font-size: 0.9rem;
      margin-bottom: 0.5rem;
      line-height: 1.3;
    }

    .card.done-card .card-title {
      text-decoration: line-through;
      color: var(--text-muted);
    }

    .card-meta {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      flex-wrap: wrap;
    }

    .owner {
      font-size: 0.7rem;
      font-weight: 500;
      padding: 0.15rem 0.4rem;
      border-radius: 4px;
    }

    .owner.alex { background: #E8F4EA; color: #4A7C59; }
    .owner.iso { background: #E8EDF4; color: #4A5C7C; }
    .owner.both { background: #F4E8F0; color: #7C4A6A; }
    .owner.carla { background: #FFF4E8; color: #7C5C4A; }
    .owner.yuka { background: #E8F0F4; color: #4A6A7C; }
    .owner.nick { background: #F0E8F4; color: #6A4A7C; }

    .priority {
      font-size: 0.6rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      padding: 0.1rem 0.35rem;
      border-radius: 3px;
    }

    .priority.high { background: #FDE8E8; color: var(--high); }
    .priority.medium { background: #FFF0E8; color: var(--medium); }
    .priority.low { background: #E8F4EA; color: var(--low); }

    .card-notes {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-top: 0.5rem;
      line-height: 1.4;
      display: none;
    }

    .card.expanded .card-notes { display: block; }

    .card-expand {
      font-size: 0.7rem;
      color: var(--text-light);
      margin-top: 0.4rem;
    }

    .empty-state {
      text-align: center;
      padding: 1.5rem 0.75rem;
      color: var(--text-muted);
      font-size: 0.85rem;
    }

    .refresh-indicator {
      position: fixed;
      bottom: 1rem;
      right: 1rem;
      background: var(--card-bg);
      padding: 0.5rem 0.75rem;
      border-radius: 20px;
      font-size: 0.7rem;
      color: var(--text-muted);
      box-shadow: var(--shadow);
      opacity: 0;
      transition: opacity 0.3s ease;
      z-index: 200;
    }

    .refresh-indicator.visible { opacity: 1; }

    .loading {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      height: 100dvh;
      font-size: 1rem;
      color: var(--text-muted);
    }

    .stats {
      display: flex;
      gap: 1rem;
      padding: 0.75rem 1rem;
      background: var(--card-bg);
      border-bottom: 1px solid var(--border);
      font-size: 0.75rem;
      color: var(--text-muted);
      overflow-x: auto;
    }

    .stat { white-space: nowrap; }
    .stat-value { font-weight: 600; color: var(--text); }

    @media (max-width: 768px) {
      .stats { padding: 0.5rem 0.75rem; gap: 0.75rem; }
    }
  </style>
</head>
<body>
  <div id="app" class="loading">Loading...</div>
  <div id="refresh" class="refresh-indicator">✓ Updated</div>

  <script>
    const DATA_URL = 'data.json';
    const REFRESH_INTERVAL = 30000;

    let data = null;
    let activeFilter = 'all';

    // Theme handling
    function initTheme() {
      const saved = localStorage.getItem('theme');
      const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      if (saved === 'dark' || (!saved && prefersDark)) {
        document.documentElement.dataset.theme = 'dark';
      }
    }

    function toggleTheme() {
      const isDark = document.documentElement.dataset.theme === 'dark';
      document.documentElement.dataset.theme = isDark ? '' : 'dark';
      localStorage.setItem('theme', isDark ? 'light' : 'dark');
      render();
    }

    initTheme();

    async function fetchData() {
      try {
        const res = await fetch(DATA_URL + '?t=' + Date.now());
        return await res.json();
      } catch (e) {
        console.error('Failed to fetch data:', e);
        return null;
      }
    }

    function formatTime(iso) {
      const date = new Date(iso);
      const now = new Date();
      const diff = now - date;
      if (diff < 60000) return 'just now';
      if (diff < 3600000) return Math.floor(diff / 60000) + 'm ago';
      if (diff < 86400000) return Math.floor(diff / 3600000) + 'h ago';
      return date.toLocaleDateString();
    }

    function getProjectColor(projectId) {
      const project = data.projects.find(p => p.id === projectId);
      return project ? project.color : '#999';
    }

    function getProjectName(projectId) {
      const project = data.projects.find(p => p.id === projectId);
      return project ? project.name : projectId;
    }

    function getFilteredCards() {
      if (activeFilter === 'all') return data.cards;
      if (['alex', 'iso', 'both', 'carla', 'yuka', 'nick'].includes(activeFilter)) {
        return data.cards.filter(c => c.owner.toLowerCase() === activeFilter);
      }
      return data.cards.filter(c => c.project === activeFilter);
    }

    function render() {
      const app = document.getElementById('app');
      const filteredCards = getFilteredCards();
      
      // Stats
      const totalActive = data.cards.filter(c => c.column !== 'done').length;
      const inProgress = data.cards.filter(c => c.column === 'in-progress').length;
      const blocked = data.cards.filter(c => c.column === 'blocked').length;
      const done = data.cards.filter(c => c.column === 'done').length;

      // Project counts
      const projectCounts = {};
      data.cards.forEach(c => {
        if (c.column !== 'done') {
          projectCounts[c.project] = (projectCounts[c.project] || 0) + 1;
        }
      });

      // Owner counts
      const ownerCounts = {};
      data.cards.forEach(c => {
        if (c.column !== 'done') {
          const owner = c.owner.toLowerCase();
          ownerCounts[owner] = (ownerCounts[owner] || 0) + 1;
        }
      });

      // Filters
      const filtersHtml = `
        <button class="filter-btn ${activeFilter === 'all' ? 'active' : ''}" data-filter="all">
          All<span class="count">${totalActive}</span>
        </button>
        ${data.projects.map(p => `
          <button class="filter-btn ${activeFilter === p.id ? 'active' : ''}" data-filter="${p.id}" style="${activeFilter === p.id ? '' : `border-color: ${p.color}40`}">
            ${p.name}${projectCounts[p.id] ? `<span class="count">${projectCounts[p.id]}</span>` : ''}
          </button>
        `).join('')}
        <button class="filter-btn ${activeFilter === 'alex' ? 'active' : ''}" data-filter="alex">
          Alex${ownerCounts.alex ? `<span class="count">${ownerCounts.alex}</span>` : ''}
        </button>
        <button class="filter-btn ${activeFilter === 'iso' ? 'active' : ''}" data-filter="iso">
          Iso${ownerCounts.iso ? `<span class="count">${ownerCounts.iso}</span>` : ''}
        </button>
      `;

      // Columns
      const columnsHtml = data.columns.map(col => {
        const cards = filteredCards.filter(c => c.column === col.id);
        const extraClass = col.id === 'blocked' ? 'blocked' : col.id === 'done' ? 'done' : '';
        
        const cardsHtml = cards.length ? cards.map(card => {
          const color = getProjectColor(card.project);
          const projectName = getProjectName(card.project);
          const isDone = col.id === 'done';
          
          return `
            <div class="card ${isDone ? 'done-card' : ''}" style="border-left-color: ${color}" onclick="this.classList.toggle('expanded')">
              <div class="card-project" style="background: ${color}20; color: ${color}">${projectName}</div>
              <div class="card-title">${card.title}</div>
              <div class="card-meta">
                <span class="owner ${card.owner.toLowerCase()}">${card.owner}</span>
                ${card.priority ? `<span class="priority ${card.priority}">${card.priority}</span>` : ''}
              </div>
              ${card.notes ? `
                <div class="card-expand">tap to ${isDone ? 'see details' : 'expand'}</div>
                <div class="card-notes">${card.notes}</div>
              ` : ''}
            </div>
          `;
        }).join('') : '<div class="empty-state">Nothing here</div>';

        return `
          <div class="column ${extraClass}">
            <div class="column-header">
              <span class="column-emoji">${col.emoji}</span>
              <span class="column-title">${col.title}</span>
              <span class="column-count">${cards.length}</span>
            </div>
            <div class="cards">${cardsHtml}</div>
          </div>
        `;
      }).join('');

      app.innerHTML = `
        <header>
          <div class="header-top">
            <h1>Mission Control</h1>
            <div style="display:flex;align-items:center;gap:0.75rem">
              <div class="last-updated">${formatTime(data.lastUpdated)}</div>
              <button class="theme-toggle" onclick="toggleTheme()" title="Toggle dark mode">
                ${document.documentElement.dataset.theme === 'dark' ? '☀️' : '🌙'}
              </button>
            </div>
          </div>
          <div class="filters">${filtersHtml}</div>
        </header>
        <div class="stats">
          <div class="stat"><span class="stat-value">${inProgress}</span> in progress</div>
          <div class="stat"><span class="stat-value">${blocked}</span> blocked</div>
          <div class="stat"><span class="stat-value">${totalActive}</span> active</div>
          <div class="stat"><span class="stat-value">${done}</span> done</div>
        </div>
        <div class="board">${columnsHtml}</div>
      `;

      app.classList.remove('loading');

      // Filter click handlers
      document.querySelectorAll('.filter-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          activeFilter = btn.dataset.filter;
          render();
        });
      });
    }

    function showRefreshIndicator() {
      const el = document.getElementById('refresh');
      el.classList.add('visible');
      setTimeout(() => el.classList.remove('visible'), 2000);
    }

    async function checkForUpdates() {
      const newData = await fetchData();
      if (!newData) return;
      
      if (data && JSON.stringify(newData) !== JSON.stringify(data)) {
        data = newData;
        render();
        showRefreshIndicator();
      }
    }

    async function init() {
      data = await fetchData();
      if (data) {
        render();
        setInterval(checkForUpdates, REFRESH_INTERVAL);
      } else {
        document.getElementById('app').innerHTML = '<div class="loading">Failed to load</div>';
      }
    }

    init();
  </script>
</body>
</html>
